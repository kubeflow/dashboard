name: KFAM Multi-Arch Build Test
on:
  pull_request:
    paths:
      - components/access-management/**
      ## NOTE: we also build on changes to profile-controller as access-management depends on profile-controller
      - components/profile-controller/**
      - releasing/version/VERSION
    branches:
      - main
      - v*-branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  IMG: ghcr.io/kubeflow/dashboard/access-management
  ARCH: linux/amd64,linux/ppc64le,linux/arm64/v8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Setup QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Build multi-arch Image
      run: |
        cd components/access-management
        make docker-build-multi-arch

name: Build & Publish CentralDashboard-Angular OCI image
on:
  push:
    branches:
      - main
      - v*-branch
    paths:
      - components/centraldashboard-angular/**
      - releasing/version/VERSION

env:
  IMG: ghcr.io/kubeflow/dashboard/dashboard-angular
  ARCH: linux/amd64,linux/ppc64le,linux/arm64/v8

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Build & Push OCI image to GHCR
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          version:
            - 'releasing/version/VERSION'

    - name: Login to GHCR
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Build and push multi-architecture OCI image (commit tag)
      run: |
        cd components/centraldashboard-angular
        make docker-build-multi-arch
        make docker-build-push-multi-arch

    - name: Build and push multi-architecture OCI image (latest tag)
      if: github.ref == 'refs/heads/main'
      run: |
        export TAG=latest
        cd components/centraldashboard-angular
        make docker-build-push-multi-arch

    - name: Build and push multi-architecture OCI image (version tag)
      id: version
      if: steps.filter.outputs.version == 'true'
      run: |
        export TAG=$(cat releasing/version/VERSION)
        cd components/centraldashboard-angular
        make docker-build-push-multi-arch

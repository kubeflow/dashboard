name: CentralDashboard-Angular Multi-Arch Build Test
on:
  pull_request:
    paths:
      - components/centraldashboard-angular/**
      - releasing/version/VERSION
    branches:
      - main
      - v*-branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  IMG: ghcr.io/kubeflow/dashboard/dashboard-angular
  ARCH: linux/amd64,linux/ppc64le,linux/arm64/v8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Build multi-arch Image
      run: |
        cd components/centraldashboard-angular
        make docker-build-multi-arch
